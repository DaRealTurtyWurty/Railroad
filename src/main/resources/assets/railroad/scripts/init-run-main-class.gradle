if (gradle.parent != null) {
    return
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def source = root.file(root.property('railroadMainSource')).canonicalFile
    def owners = []
    root.allprojects.each { project ->
        project.extensions.findByType(SourceSetContainer)?.each { sources ->
            if (sources.java.contains(source)) owners << [project, sources]
        }
    }
    if (owners.size() != 1) {
        throw new GradleException("Expected one Java source set containing ${source}, found ${owners.size()}")
    }
    def (owner, sources) = owners.first()
    if (root.hasProperty('railroadTestMethod')) {
        def candidates = owner.tasks.withType(Test).findAll { test ->
            !test.testClassesDirs.files.intersect(sources.output.classesDirs.files).empty
        }
        def target = candidates.find { it.name == sources.name }
        if (target == null && candidates.size() == 1) target = candidates.first()
        if (target == null) {
            throw new GradleException("Expected one Test task for ${owner.path} source set ${sources.name}, found ${candidates*.path}")
        }
        target.setTestNameIncludePatterns([
            root.property('railroadMainClass') + '.' + root.property('railroadTestMethod')
        ])
        target.outputs.upToDateWhen { false }
        target.outputs.doNotCacheIf('Railroad selected a test method') { true }
        root.tasks.register(root.property('railroadMainTask')) {
            dependsOn(target)
            ext.railroadTestTarget = target
        }
        return
    }
    root.tasks.register(root.property('railroadMainTask'), JavaExec) {
        mainClass.set(root.property('railroadMainClass'))
        classpath = sources.runtimeClasspath
        dependsOn(owner.tasks.named(sources.classesTaskName))
        javaLauncher.set(owner.javaToolchains.launcherFor(owner.java.toolchain))
        workingDir(owner.projectDir)
        standardInput = System.in
    }
}
